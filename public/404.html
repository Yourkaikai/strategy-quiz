<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect — standard pattern
      // When GitHub Pages serves this 404.html for any unknown path,
      // we encode the intended path as a query param and redirect to
      // the app root, which will restore it via history.replaceState.
      //
      // e.g. /strategy-quiz/practice  →  /strategy-quiz/?p=practice
      //      /strategy-quiz/exam/session  →  /strategy-quiz/?p=exam/session
      var basePath = '/strategy-quiz';
      var loc = window.location;
      var path = loc.pathname;

      // Strip the base path prefix to get just the sub-route
      var subPath = path.startsWith(basePath) ? path.slice(basePath.length) : path;
      // Remove leading slash
      subPath = subPath.replace(/^\//, '');

      var search = loc.search.slice(1).replace(/&/g, '~and~');
      var target = loc.origin + basePath + '/?p=' + encodeURIComponent(subPath);
      if (search) target += '&q=' + search;
      target += loc.hash;

      loc.replace(target);
    </script>
  </head>
  <body>Redirecting...</body>
</html>
