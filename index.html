<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strategy Quiz</title>
    <script>
    (function() {
      var stored = localStorage.getItem('theme');
      if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      // GitHub Pages SPA redirect: restore the real URL from the ?p= param
      var params = new URLSearchParams(window.location.search);
      var spaPath = params.get('p');
      if (spaPath !== null) {
        var decoded = decodeURIComponent(spaPath);
        var hash = window.location.hash || '';
        var newUrl = '/strategy-quiz/' + (decoded ? decoded + '/' : '');
        window.history.replaceState(null, null, newUrl + hash);
      }
    })();
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
